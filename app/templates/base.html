<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Fantasy de Clase{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/estilos.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-md navbar-fc">
    <div class="container">
      <a class="navbar-brand" href="/">
        <span class="navbar-brand-icono">🏆</span> Fantasy de Clase
      </a>
      {% if request.state.usuario %}
      <div class="d-flex align-items-center gap-2 ms-auto">
        <span class="badge-usuario">
          {{ "👨‍🏫" if request.state.usuario.tipo == "profesor" else "🎓" }}
          {{ request.state.usuario.nombre }}
        </span>
        <button class="btn btn-sm btn-logout" id="btn-logout-nav">Salir</button>
      </div>
      {% endif %}
    </div>
  </nav>

  <main class="container flex-grow-1 py-4">
    {% block contenido %}{% endblock %}
  </main>

  <footer class="text-center text-muted py-3 small">
    Fantasy de Clase
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/validaciones.js"></script>
  <script>
    document.querySelector("#btn-logout-nav")?.addEventListener("click", async () => {
      await fetch("/auth/logout", { method: "POST" });
      window.location.href = "/";
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
